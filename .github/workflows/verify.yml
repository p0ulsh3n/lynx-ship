name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Node ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@${{ matrix.node-version }}
          install: false
          cache: false
      - name: Show toolchain
        run: |
          node --version
          pnpm --version
      - name: Install dependencies
        shell: bash
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set network-concurrency 8
          pnpm config set fetch-retries 5
          pnpm config set fetch-timeout 120000

          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --reporter=append-only; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          exit 1
      - run: pnpm verify

  android:
    runs-on: ubuntu-24.04
    name: Real Android release build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          install: false
          cache: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Install dependencies
        shell: bash
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set network-concurrency 8
          pnpm config set fetch-retries 5
          pnpm config set fetch-timeout 120000
          pnpm install --frozen-lockfile --reporter=append-only
      - name: Build LynxShip CLI
        run: pnpm --filter @lynxship/cli build
      - name: Generate ephemeral Android signing key
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/lynxship-ci-release.jks"
          keytool -genkeypair \
            -noprompt \
            -keystore "$keystore" \
            -storetype JKS \
            -storepass "lynxship-ci-store" \
            -keypass "lynxship-ci-key" \
            -alias lynxship-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=LynxShip CI, OU=Tests, O=LynxShip, L=CI, ST=CI, C=US"
          chmod 600 "$keystore"
          {
            echo "LYNXSHIP_KEYSTORE_PATH=$keystore"
            echo "LYNXSHIP_KEY_ALIAS=lynxship-ci"
            echo "LYNXSHIP_KEYSTORE_PASSWORD=lynxship-ci-store"
            echo "LYNXSHIP_KEY_PASSWORD=lynxship-ci-key"
          } >> "$GITHUB_ENV"
      - name: Build and verify the Android APK through LynxShip
        shell: bash
        run: |
          chmod +x examples/lynx-android-demo/android/gradlew
          output="$RUNNER_TEMP/lynxship-android-build.json"
          set +e
          node packages/cli/dist/index.js build \
            --project-dir examples/lynx-android-demo \
            --platform android \
            --profile production \
            --no-upload \
            --non-interactive \
            --json > "$output"
          status=$?
          set -e
          cat "$output"
          test "$status" -eq 0
          BUILD_OUTPUT="$output" node <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync(process.env.BUILD_OUTPUT, "utf8"));
          if (result.state !== "success") {
            throw new Error(`Android build did not succeed: ${result.state}`);
          }
          if (!result.artifact?.path || !fs.existsSync(result.artifact.path)) {
            throw new Error("LynxShip did not produce a local Android artifact");
          }
          if (!result.artifact.path.endsWith(".apk")) {
            throw new Error(`Expected an APK, received ${result.artifact.path}`);
          }
          NODE

  ios:
    runs-on: macos-15
    name: iOS toolchain and host guard
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          install: false
          cache: false
      - name: Show Apple toolchain
        run: |
          node --version
          pnpm --version
          xcodebuild -version
          xcode-select -p
      - name: Build official Lynx iOS simulator fixture
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/integrating-lynx-demo-projects"
          git clone --depth 1 https://github.com/lynx-family/integrating-lynx-demo-projects.git "$fixture"
          pushd "$fixture/ios/HelloLynxSwift"
          pod install --no-repo-update
          xcodebuild \
            -workspace Hello-Lynx.xcworkspace \
            -scheme Hello-Lynx \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
          popd
      - name: Compile the reusable LynxShip iOS container pod
        shell: bash
        run: |
          pod lib lint packages/sdk-ios/lynxship-ota.podspec \
            --allow-warnings \
            --skip-tests \
            --no-repo-update \
            --no-clean \
            --verbose
      - name: Compile the LynxShip iOS navigation pod
        shell: bash
        run: |
          pod lib lint packages/navigation/ios/lynxship-navigation.podspec \
            --allow-warnings \
            --skip-tests \
            --no-repo-update \
            --no-clean \
            --verbose
      - name: Compile the LynxShip iOS media pod
        shell: bash
        run: |
          pod lib lint packages/media/ios/lynxship-media.podspec \
            --allow-warnings \
            --skip-tests \
            --no-repo-update \
            --no-clean \
            --verbose
      - name: Install dependencies
        shell: bash
        run: |
          pnpm config set registry https://registry.npmjs.org/
          pnpm config set network-concurrency 8
          pnpm config set fetch-retries 5
          pnpm config set fetch-timeout 120000
          pnpm install --frozen-lockfile --reporter=append-only
      - name: Build CLI
        run: pnpm --filter @lynxship/cli build
      - name: Verify real iOS builds never fall back to a fake artifact
        shell: bash
        run: |
          set +e
          build_output="$(node packages/cli/dist/index.js build \
            --project-dir examples/lynx-basic-template \
            --platform ios --profile production --no-upload --json --non-interactive)"
          status=$?
          set -e
          printf '%s\n' "$build_output"
          test "$status" -eq 1
          BUILD_OUTPUT="$build_output" node <<'NODE'
          const result = JSON.parse(process.env.BUILD_OUTPUT);
          if (result.code !== "IOS_HOST_REQUIRED") {
            throw new Error(`Expected IOS_HOST_REQUIRED, received ${result.code}`);
          }
          NODE
      - name: Generate and compile the LynxShip iOS host
        shell: bash
        run: |
          node packages/cli/dist/index.js ios host init \
            --project-dir examples/lynx-basic-template \
            --bundle-identifier com.lynxship.ci \
            --non-interactive \
            --json
          cp "$RUNNER_TEMP/integrating-lynx-demo-projects/ios/HelloLynxSwift/main.lynx.bundle" \
            examples/lynx-basic-template/ios/main.lynx.bundle
          pushd examples/lynx-basic-template/ios
          pod install --no-repo-update
          xcodebuild \
            -workspace LynxBasicTemplate.xcworkspace \
            -scheme LynxBasicTemplate \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
          popd
      - name: Build and install the iOS Simulator app through LynxShip
        shell: bash
        run: |
          output="$RUNNER_TEMP/lynxship-ios-simulator-build.json"
          set +e
          node packages/cli/dist/index.js build \
            --project-dir examples/lynx-basic-template \
            --platform ios \
            --simulator \
            --profile simulator \
            --no-upload \
            --non-interactive \
            --json > "$output"
          status=$?
          set -e
          cat "$output"
          test "$status" -eq 0
          BUILD_OUTPUT="$output" node <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync(process.env.BUILD_OUTPUT, "utf8"));
          if (result.state !== "success") {
            throw new Error(`iOS Simulator build did not succeed: ${result.state}`);
          }
          if (!result.artifact?.path || !fs.existsSync(result.artifact.path)) {
            throw new Error("LynxShip did not produce a local iOS Simulator artifact");
          }
          if (!result.artifact.path.endsWith(".app")) {
            throw new Error(`Expected an iOS Simulator .app, received ${result.artifact.path}`);
          }
          NODE
      - name: Verify iOS host diagnostics
        shell: bash
        run: |
          doctor_output="$(node packages/cli/dist/index.js doctor \
            --project-dir examples/lynx-basic-template \
            --platform ios --json)"
          printf '%s\n' "$doctor_output"
          DOCTOR_OUTPUT="$doctor_output" node <<'NODE'
          const result = JSON.parse(process.env.DOCTOR_OUTPUT);
          const host = result.checks.find((check) => check.name === "ios-host");
          if (!host || host.status !== "pass") {
            throw new Error("The iOS doctor must report the generated Xcode host as ready.");
          }
          NODE
