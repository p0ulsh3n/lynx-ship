services:
  api:
    environment:
      NODE_ENV: production
      LYNXSHIP_REQUIRE_AUTH: "1"
      LYNXSHIP_TOKEN: ${LYNXSHIP_TOKEN:?Set LYNXSHIP_TOKEN in the production environment}
      LYNXSHIP_DATABASE_DRIVER: postgres
      LYNXSHIP_QUEUE_DRIVER: redis
      LYNXSHIP_STORAGE_DRIVER: r2
      DATABASE_URL: ${DATABASE_URL:?Set an URL-encoded PostgreSQL DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set a Redis REDIS_URL}
      R2_ENDPOINT: ${R2_ENDPOINT:?Set the Cloudflare R2 S3 endpoint}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set the least-privilege R2 access key}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set the R2 secret access key}
      R2_BUCKET: ${R2_BUCKET:?Set the R2 bucket name}
      LYNXSHIP_RATE_LIMIT: ${LYNXSHIP_RATE_LIMIT:-120}
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  queue:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
